[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
authors = [{name = "Ifrit", email = "contact@ifritnoises.org"}]
name = "sara"
version = "1.4.0"
description = "RouterOS Security Assessment Toolkit"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.9"
dependencies = [
    "librouteros>=4.2",
    "colorama",
]
keywords = ["mikrotik", "security", "ioc", "networking", "maintenance", "infrastructure"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Operating System :: Unix",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking :: Monitoring",
    "Topic :: Security",
  ]

[project.urls]
Repository = "https://github.com/ifritnoises/sara"
Homepage = "https://github.com/ifritnoises/sara"
Issues = "https://github.com/ifritnoises/sara/issues"

[project.scripts]
sara = "sara:main"

[tool.setuptools]
py-modules = ["sara"]
packages = ["saramodules"]
